<h1 class="h5 mb-1">你好，{{ customer.display_name }}</h1>
<p class="text-secondary mb-3">請選擇服務項目</p>

<div class="list-group">
  {% for service in services %}
    <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            hx-get="{% url 'liff-book-staff' service.pk %}">
      <span>
        <span class="fw-semibold">{{ service.name }}</span><br>
        <small class="text-secondary">{{ service.duration_minutes }} 分鐘</small>
      </span>
      <span class="text-nowrap">NT$ {{ service.price }}</span>
    </button>
  {% empty %}
    <div class="list-group-item text-secondary">目前沒有開放預約的服務</div>
  {% endfor %}
</div>
