<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h4 mb-3">歡迎使用預約系統</h1>
    <p id="greeting" class="text-secondary">載入中...</p>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const greeting = document.getElementById("greeting");

    async function loginToBackend() {
      // 只把 ID token 送到後端，由後端驗證後決定身分；不傳 userId / profile
      const idToken = liff.getIDToken();
      if (!idToken) {
        throw new Error("取不到 ID token，請確認 LIFF scope 已勾選 openid");
      }
      const resp = await fetch("{% url 'liff-line-login' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ id_token: idToken }),
      });
      // 錯誤時後端可能回 HTML（例如 CSRF 403），不能直接假設是 JSON
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.error || `登入失敗（${resp.status}）`);
      }
      return data.customer;
    }

    liff.init({ liffId: "{{ liff_id }}" }).then(async () => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const customer = await loginToBackend();
      greeting.textContent = `你好，${customer.display_name}`;
      greeting.classList.replace("text-secondary", "text-body");
    }).catch((err) => {
      greeting.textContent = "初始化失敗：" + err.message;
      greeting.classList.replace("text-secondary", "text-danger");
    });
  </script>
</body>
</html>
