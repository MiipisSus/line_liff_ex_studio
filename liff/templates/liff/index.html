<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .day-strip { overflow-x: auto; white-space: nowrap; }
    .day-strip .btn { min-width: 4rem; }
    /* 觸控裝置沒有真正的 hover：HTMX 換畫面後，手指最後位置上的新按鈕會殘留 :hover 樣式，
       看起來像被選取。這裡讓 hover 樣式等於一般樣式。 */
    @media (hover: none) {
      .btn {
        --bs-btn-hover-bg: var(--bs-btn-bg);
        --bs-btn-hover-color: var(--bs-btn-color);
        --bs-btn-hover-border-color: var(--bs-btn-border-color);
      }
      .list-group { --bs-list-group-action-hover-bg: var(--bs-list-group-bg); }
    }
  </style>
</head>
{# hx-target / hx-swap / CSRF header 由所有子元素繼承 #}
<body class="bg-light"
      hx-target="#app" hx-swap="innerHTML show:window:top"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <main id="app" class="container py-4" style="max-width: 560px;">
    <p id="greeting" class="text-secondary">載入中...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 4xx 回應也要替換畫面（錯誤訊息 partial），5xx 不替換
    htmx.config.responseHandling = [
      { code: "204", swap: false },
      { code: "[23]..", swap: true },
      { code: "4..", swap: true, error: true },
      { code: "...", swap: false, error: true },
    ];
    document.body.addEventListener("htmx:afterSwap", () => {
      // 換畫面後把選取中的日期捲到日期列中間，避免每次都跳回最左邊
      document.querySelector('.day-strip [aria-pressed="true"]')
        ?.scrollIntoView({ inline: "center", block: "nearest" });

      // 預約成功：從官方帳號聊天室開啟時，以顧客名義送出一則文字，
      // 讓 bot 透過 webhook 用 reply（不計費）回覆預約明細。
      // 需要 LIFF scope chat_message.write；不是從聊天室開啟或未授權時靜默略過，畫面上已有成功訊息。
      const created = document.getElementById("booking-created");
      if (created && liff.getContext()?.type === "utou") {
        liff.sendMessages([{ type: "text", text: `我已完成預約 #${created.dataset.bookingId}` }])
          .catch((err) => console.warn("sendMessages 失敗", err));
      }
    });
    // 「加入官方帳號好友」：優先用 liff.requestFriendship() 在 LIFF 內彈出加好友視窗
    // （需 LIFF 畫面尺寸為 Full）；失敗時改開加好友連結。加好友後由 webhook follow 事件更新後端狀態。
    document.body.addEventListener("click", async (e) => {
      const button = e.target.closest("[data-request-friendship]");
      if (!button) return;
      try {
        await liff.requestFriendship();
        const { friendFlag } = await liff.getFriendship();
        if (friendFlag) {
          document.getElementById("friend-notice")?.replaceChildren(
            Object.assign(document.createElement("span"), { textContent: "已加入好友，之後會透過 LINE 通知您。" })
          );
        }
      } catch (err) {
        console.warn("requestFriendship 失敗", err);
        if (button.dataset.fallbackUrl) {
          liff.openWindow({ url: button.dataset.fallbackUrl, external: false });
        }
      }
    });
    document.body.addEventListener("htmx:responseError", (e) => {
      if (e.detail.xhr.status >= 500) {
        alert("系統暫時發生問題，請稍後再試");
      }
    });

    const greeting = document.getElementById("greeting");

    async function loginToBackend() {
      // 只把 ID token 送到後端，由後端驗證後決定身分；不傳 userId / profile
      const idToken = liff.getIDToken();
      if (!idToken) {
        throw new Error("取不到 ID token，請確認 LIFF scope 已勾選 openid");
      }
      const resp = await fetch("{% url 'liff-line-login' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ id_token: idToken }),
      });
      // 錯誤時後端可能回 HTML（例如 CSRF 403），不能直接假設是 JSON
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.error || `登入失敗（${resp.status}）`);
      }
      return data.customer;
    }

    liff.init({ liffId: "{{ liff_id }}" }).then(async () => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      await loginToBackend();
      htmx.ajax("GET", "{% url 'liff-book-services' %}", { target: "#app" });
    }).catch((err) => {
      greeting.textContent = "初始化失敗：" + err.message;
      greeting.classList.replace("text-secondary", "text-danger");
    });
  </script>
</body>
</html>
